name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  musl:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: native             # x86_64 static
            arch: x86_64
          - target: aarch64-linux-musl # also runs in Android/Termux
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build static binary
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            alpine:3.20 sh /src/scripts/build-musl.sh \
              ${{ matrix.target }} ${{ matrix.arch }} /out
      - uses: actions/upload-artifact@v4
        with:
          name: sensme-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 pkg-config bzip2
      - name: Build exe
        run: sh scripts/build-windows.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: sensme-windows-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [musl, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
