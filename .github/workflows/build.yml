name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static binary
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            alpine:3.20 sh /src/scripts/build-musl.sh x86_64 /out
      - uses: actions/upload-artifact@v4
        with:
          name: sensme-linux-x86_64
          path: dist/*
          if-no-files-found: error

  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config xz-utils bzip2 file
      - name: Build static binary
        run: sh scripts/build-linux-aarch64.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: sensme-linux-aarch64
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config mingw-w64 bzip2 file
      - name: Build exe
        run: sh scripts/build-windows.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: sensme-windows-x86_64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, linux-aarch64, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
